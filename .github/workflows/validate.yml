name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python scripts/validate_portable.py
      - name: Scan repository safety contracts
        run: python scripts/security_scan.py
      - name: Check shell syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Run portable tests
        run: |
          for test_script in tests/test-*.sh; do
            "$test_script"
          done
      - name: Check placeholders
        run: |
          ! grep -RInE '\[TODO:|TODO\b|FIXME\b' . \
            --exclude-dir=.git --exclude=validate.sh \
            --exclude=validate_portable.py --exclude=validate.yml
      - name: Check JSON
        run: |
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/shadowsduck-homelab/.codex-plugin/plugin.json >/dev/null
